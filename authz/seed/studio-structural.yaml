# Studio-profile structural graph (Option B persists ONLY this).
# Role tuples never appear here - the enforcement library injects them per
# request; the persisted-mode demo roles live in studio-persisted-demo.yaml.
# Four teams; networks cover both the console demo ids (*--net) and every
# network the demo runtime actually serves (registries/vibe).

