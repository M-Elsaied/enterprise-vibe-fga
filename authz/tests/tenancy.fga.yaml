name: vibe-tenancy
model_file: ../model/fga.mod
tuples:
  # platform + super admin (core team)
  - {user: "user:sam", relation: member, object: "group:core"}
  - {user: "group:core#member", relation: super_admin, object: "platform:vibe"}
  # tenant alpha: admin ada, member alice
  - {user: "platform:vibe", relation: platform, object: "tenant:alpha"}
  - {user: "user:ada", relation: member, object: "group:alpha-admins"}
  - {user: "group:alpha-admins#member", relation: admin, object: "tenant:alpha"}
  - {user: "user:alice", relation: member, object: "group:alpha-team"}
  - {user: "group:alpha-team#member", relation: member, object: "tenant:alpha"}
  # tenant beta: member bob
  - {user: "platform:vibe", relation: platform, object: "tenant:beta"}
  - {user: "user:bob", relation: member, object: "group:beta-team"}
  - {user: "group:beta-team#member", relation: member, object: "tenant:beta"}
  # networks: private to alpha / published platform-wide / shared to beta only
  - {user: "tenant:alpha", relation: tenant, object: "agent_network:alpha--private"}
  - {user: "user:alice", relation: builder, object: "agent_network:alpha--private"}
  - {user: "tenant:alpha", relation: tenant, object: "agent_network:alpha--public"}
  - {user: "user:*", relation: published_to, object: "agent_network:alpha--public"}
  - {user: "tenant:alpha", relation: tenant, object: "agent_network:alpha--shared"}
  - {user: "tenant:beta#member", relation: published_to, object: "agent_network:alpha--shared"}
  # connector with a time-boxed direct grant
  - {user: "tenant:alpha", relation: tenant, object: "connector:crm"}
  - user: "user:carol"
    relation: can_use
    object: "connector:crm"
    condition:
      name: time_boxed
      context: {valid_until: "2026-12-31T23:59:59Z"}
  # llm entitlements: default for all, premium approved for alpha only.
  # Every llm_model/feature object needs its platform link tuple (written at
  # catalog registration) or super_admin does not inherit onto it.
  - {user: "platform:vibe", relation: platform, object: "llm_model:centralized-default"}
  - {user: "platform:vibe", relation: platform, object: "llm_model:premium-opus"}
  - {user: "user:*", relation: available_to, object: "llm_model:centralized-default"}
  - {user: "tenant:alpha#member", relation: available_to, object: "llm_model:premium-opus"}
  # byom feature enabled for alice only
  - {user: "platform:vibe", relation: platform, object: "feature:byom"}
  - {user: "user:alice", relation: enabled_for, object: "feature:byom"}

tests:
  - name: tenant isolation
    check:
      - user: user:alice
        object: agent_network:alpha--private
        assertions: {can_invoke: true, can_edit: true, can_publish: false, can_delete: true}
      - user: user:ada
        object: agent_network:alpha--private
        assertions: {can_invoke: true, can_publish: true, can_delete: true}
      - user: user:bob
        object: agent_network:alpha--private
        assertions: {can_invoke: false, can_edit: false}
      - user: user:sam
        object: agent_network:alpha--private
        assertions: {can_invoke: true, can_delete: true}
      - user: user:system
        object: agent_network:alpha--private
        assertions: {can_invoke: false}

  - name: marketplace publish org-wide and targeted
    check:
      - user: user:bob
        object: agent_network:alpha--public
        assertions: {can_invoke: true, can_edit: false}
      - user: user:bob
        object: agent_network:alpha--shared
        assertions: {can_invoke: true}
      - user: user:carol
        object: agent_network:alpha--shared
        assertions: {can_invoke: false}
      - user: user:carol
        object: agent_network:alpha--public
        assertions: {can_invoke: true}
    list_objects:
      - user: user:bob
        type: agent_network
        assertions:
          can_invoke: [agent_network:alpha--public, agent_network:alpha--shared]
      - user: user:alice
        type: agent_network
        assertions:
          can_invoke: [agent_network:alpha--private, agent_network:alpha--public, agent_network:alpha--shared]

  - name: connector time-boxed access
    check:
      - user: user:carol
        object: connector:crm
        context: {current_time: "2026-06-01T00:00:00Z"}
        assertions: {can_use: true}
      - user: user:carol
        object: connector:crm
        context: {current_time: "2027-06-01T00:00:00Z"}
        assertions: {can_use: false}
      - user: user:alice
        object: connector:crm
        assertions: {can_use: true}
      - user: user:bob
        object: connector:crm
        assertions: {can_use: false}

  - name: llm and byom entitlements
    check:
      - user: user:bob
        object: llm_model:centralized-default
        assertions: {can_use: true}
      - user: user:bob
        object: llm_model:premium-opus
        assertions: {can_use: false, can_approve: false}
      - user: user:alice
        object: llm_model:premium-opus
        assertions: {can_use: true}
      - user: user:sam
        object: llm_model:premium-opus
        assertions: {can_use: true, can_approve: true}
      - user: user:alice
        object: feature:byom
        assertions: {can_use: true}
      - user: user:bob
        object: feature:byom
        assertions: {can_use: false}
